# mlx_lm.lora configuration for the Report agent adapter (QLoRA: LoRA on the 4-bit base).
# Mirrors the reference recipe: rank 16, alpha 32 (mlx "scale" = alpha / rank = 2.0), dropout 0.05,
# 3 epochs (2 underfits tone, 4+ overfits), lr 2e-4, sequence length 4,096, loss masked on the prompt.
model: "mlx-community/Qwen3.6-35B-A3B-4bit"   # must equal the report tier's model_id
train: true
fine_tune_type: lora
data: "finetune/data/neutral"                  # overridden per tone cluster by train.sh
adapter_path: "finetune/adapters/report-neutral-v1"
seed: 20261012
num_layers: 16                                 # LoRA on the top 16 transformer blocks
batch_size: 2
grad_accumulation_steps: 2                     # effective batch 4; needs a recent mlx-lm (drop the line on older versions)
iters: 300                                     # train.sh recomputes = ceil(3 epochs × n_train / 4)
learning_rate: 2.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 20
  arguments: [2.0e-4, 300, 1.0e-6]
max_seq_length: 4096
mask_prompt: true                              # learn the report, not the findings JSON
grad_checkpoint: true
steps_per_report: 10
steps_per_eval: 50
val_batches: 25
save_every: 100
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj"]
  rank: 16
  scale: 2.0
  dropout: 0.05
