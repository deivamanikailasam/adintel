[project]
name = "adintel"
version = "0.1.0"
description = "AdIntel — an enterprise-governed, multi-agent AI system that watches paid-ad performance, explains problems, proposes fixes and writes client reports. Local-first (mlx-lm) with a documented path to AWS production."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Deiva Mani Kailasam" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "langgraph>=0.2.40",
  "httpx>=0.27",
  "pymongo>=4.8",
  "redis>=5.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "pyjwt[crypto]>=2.9",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "apscheduler>=3.10,<4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real embeddings + cross-encoder reranking (BGE family, ONNX — runs on a laptop CPU).
ml = ["fastembed>=0.4"]
# Production adapters (Bedrock, SQS, Secrets Manager). Not needed locally.
aws = ["boto3>=1.35"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "fakeredis>=2.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "types-PyYAML",
]

[project.scripts]
adintel = "adintel.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "integration: needs real MongoDB/Redis (set ADINTEL_MONGO_URI / ADINTEL_REDIS_URL)",
  "mlx: needs the local mlx-lm servers running",
  "chaos: failure-injection tests",
]

[tool.coverage.run]
source = ["src/adintel"]
# The 85% gate applies to code the unit/API/e2e/chaos suites can reach. Excluded here and covered by
# their own CI jobs instead: the eval harness (`evals` job), the MongoDB and Redis backends
# (`integration` job), AWS adapters (staging), the live-connector placeholder, and process entrypoints.
omit = [
  "src/adintel/llm/providers/bedrock.py",
  "src/adintel/queueing/sqs.py",
  "src/adintel/queueing/redis_queue.py",
  "src/adintel/storage/mongo.py",
  "src/adintel/security/secrets_aws.py",
  "src/adintel/connectors/live.py",
  "src/adintel/evals/runner.py",
  "src/adintel/evals/generate.py",
  "src/adintel/evals/worlds.py",
  "src/adintel/evals/judge.py",
  "src/adintel/__main__.py",
  "src/adintel/*/__main__.py",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "E501",   # line length is owned by `ruff format`
  "RUF001", "RUF002", "RUF003",  # en dashes and arrows in docs/strings are intentional
  "UP046", "UP047",  # keep Generic[T] syntax readable for reviewers new to PEP 695
  "S101",   # assert is fine in tests
  "RUF012", # pydantic class vars
  "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"evals/**" = ["S311"]
"scripts/**" = ["S"]
"finetune/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
