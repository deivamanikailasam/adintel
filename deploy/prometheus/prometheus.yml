global: { scrape_interval: 15s, evaluation_interval: 30s }
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
scrape_configs:
  # native processes on the host (make run-api / run-worker / run-executor)
  - job_name: adintel-host
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels: { service: api }
      - targets: ["host.docker.internal:9464"]
        labels: { service: worker }
      - targets: ["host.docker.internal:9465"]
        labels: { service: executor }
  # containers (compose profile "app")
  - job_name: adintel-containers
    static_configs:
      - targets: ["api:8000"]
        labels: { service: api }
      - targets: ["worker:9464"]
        labels: { service: worker }
      - targets: ["executor:9465"]
        labels: { service: executor }
