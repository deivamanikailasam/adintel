name: Feature or change
description: Propose a capability or a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: "Who is affected and how often? Numbers help." }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
  - type: textarea
    id: risk
    attributes: { label: Governance and safety impact, description: "Does it touch approvals, autonomy level, tenant data, model choice or cost?" }
