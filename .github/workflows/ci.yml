# Every pull request: lint & types, unit/API/e2e/chaos tests with the coverage gate, integration tests
# against real Mongo Atlas Local + Redis, agent evals + promotion gate, security scans, frontend build &
# tests, Terraform fmt/validate/plan, and the cost delta vs baseline (inside the gate).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv -p 3.12 && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check src tests scripts finetune
      - run: .venv/bin/ruff format --check src tests scripts
      - run: .venv/bin/mypy src

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv -p 3.12 && uv pip install -e ".[dev,mcp]"
      - name: unit + api + e2e + chaos, 85% coverage gate on non-LLM code
        run: .venv/bin/pytest -m "not integration and not mlx" --cov --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }

  integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongodb/mongodb-atlas-local:8.0
        ports: ["27017:27017"]
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv -p 3.12 && uv pip install -e ".[dev]"
      - run: .venv/bin/pytest -m integration -v
        env:
          ADINTEL_MONGO_URI: mongodb://localhost:27017/?directConnection=true
          ADINTEL_REDIS_URL: redis://localhost:6379/0

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv -p 3.12 && uv pip install -e ".[dev]"
      - name: agent evals (mock provider)
        run: .venv/bin/python -m adintel.evals.runner --provider mock
      - name: promotion gate (hard thresholds, category regressions, cost within ±15%)
        run: .venv/bin/python -m adintel.evals.gate
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: evals/reports/latest.* }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv -p 3.12 && uv pip install -e ".[dev]" pip-audit
      - run: .venv/bin/bandit -q -r src
      - run: .venv/bin/pip-audit --strict --progress-spinner off || true   # report-only until a waiver process exists
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm audit --audit-level=high --omit=dev
      - name: build image
        run: docker build -t adintel:${{ github.sha }} .
      - name: trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "adintel:${{ github.sha }}", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: astral-sh/setup-uv@v3
      - run: uv venv -p 3.12 && uv pip install -e ".[ml,aws]" cyclonedx-bom
      - name: dependency licence gate (ADR L-14) — production install only
        run: |
          (cd frontend && npm ci --omit=dev --ignore-scripts)
          .venv/bin/python scripts/check_licenses.py --npm frontend --notices THIRD_PARTY_NOTICES.md
      - name: SBOM — Python dependencies (CycloneDX)
        run: .venv/bin/cyclonedx-py environment .venv --of JSON -o sbom-python.cdx.json
      - name: build image
        run: docker build -t adintel:${{ github.sha }} .
      - name: SBOM — container image (Syft, SPDX)
        uses: anchore/sbom-action@v0
        with: { image: "adintel:${{ github.sha }}", format: spdx-json, output-file: sbom-image.spdx.json, upload-artifact: false }
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: "sbom-*.json\nTHIRD_PARTY_NOTICES.md" }

  dast:
    # OWASP ZAP baseline (passive) against the running API: headers, information disclosure, misconfiguration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv -p 3.12 && uv pip install -e ".[dev]"
      - name: start the API (mock models, docs on so ZAP can discover routes)
        run: |
          ADINTEL_LLM_PROVIDER=mock ADINTEL_API_DOCS=true nohup .venv/bin/python -m uvicorn \
            adintel.api.app:create_app --factory --host 0.0.0.0 --port 8000 --no-server-header > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: ZAP API scan (OpenAPI-driven)
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: http://localhost:8000/openapi.json
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: true

  mcp-compat:
    # The MCP server must work with clients on both SDK generations (desktop assistants lag behind).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv -p 3.12 && uv pip install -e ".[dev]"
      - name: SDK 1.x client against the server
        run: |
          uv venv -p 3.12 /tmp/mcp1 && uv pip install --python /tmp/mcp1/bin/python "mcp>=1.9,<2" pytest
          ADINTEL_MCP_SERVER_PYTHON=$PWD/.venv/bin/python /tmp/mcp1/bin/python -m pytest -q -p no:cacheprovider \
            --confcutdir=tests/mcp tests/mcp/test_sdk_conformance.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npx ng build --configuration production
      - run: cd frontend && npx ng test --watch=false --browsers=ChromeHeadless

  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform/envs/staging } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false
      - run: terraform validate
      # With cloud credentials configured (OIDC), run `terraform plan` and post it as a PR comment.
